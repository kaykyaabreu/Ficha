<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas — Alfa v0.6</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f1d1a;--mu:#6b665e;--bd:#ddd8cc;--ac:#8a3b12;--ac2:#f3e3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--card:#221f18;--tx:#efe9dc;--mu:#a39b8b;--bd:#3a352a;--ac:#e8925c;--ac2:#3a2a1e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17150f;--card:#221f18;--tx:#efe9dc;--mu:#a39b8b;--bd:#3a352a;--ac:#e8925c;--ac2:#3a2a1e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font:700 18px Georgia,serif;margin:0;color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font:700 13px system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);margin:0 0 8px}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
label{display:block;font-size:12px;color:var(--mu)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 8px;min-width:0}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:8px;padding:7px 12px}
button:disabled{opacity:.4;cursor:default}
button.s{background:transparent;color:var(--ac)}
.badge{font-size:12px;background:var(--ac2);color:var(--ac);padding:3px 8px;border-radius:99px}
.st{font-size:12px;color:var(--mu)}
.big{font:700 22px Georgia,serif;color:var(--tx)}
.stat{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.row>*:first-child{flex:2}.row>button{flex:0 0 auto;padding:6px 10px}
.sp{display:grid;grid-template-columns:minmax(0,1fr) 136px 46px;gap:6px;align-items:center;margin-bottom:4px}
.sp b{cursor:pointer;font-weight:500;overflow-wrap:anywhere}.sp b:hover{color:var(--ac)}
.sp small{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px;border-bottom:1px solid var(--bd);text-align:left}
.pc{cursor:pointer}.pc:hover{border-color:var(--ac)}
#roll{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:9;max-width:92%}
.warn{background:var(--ac2);border:1px solid var(--ac);border-radius:10px;padding:10px;margin-bottom:12px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--tx);margin:4px 12px 2px 0;cursor:pointer}
.ck input{width:auto;margin:0}
button.pill{padding:2px 9px;font-size:12px}
button.pill.on{background:var(--ac2)}
.st.arm{color:var(--ac)}
.vl td[data-mitp],.vl th.mt{text-align:center}
.vl td[data-mitp]{font-weight:600}
.dp{display:flex;justify-content:center;gap:12px;font-size:12px;color:var(--mu)}
.dp b{display:block;font:700 18px Georgia,serif;color:var(--tx)}
#txo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#txo .card{width:100%;max-width:760px;max-height:90vh;overflow:auto;margin:0}
#txo textarea{min-height:50vh;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}

/* ===================== RESPONSIVO =====================
   Celular:    até 599px
   Tablet:     600px a 1023px
   Computador: 1024px ou mais (ficha em duas colunas)
   Tela de toque (celular e tablet): campos com 16px para o iPhone/iPad
   não darem zoom ao tocar num campo, e botões maiores para o dedo.
   ======================================================= */
header>span{display:flex;align-items:center;gap:6px;min-width:0;justify-content:flex-end}
h1{white-space:nowrap}
#role{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#role:empty{display:none}
#save{white-space:nowrap}
.row.chips>*{flex:0 0 auto}
.tw{overflow-x:auto}
.vl td:nth-child(2){white-space:nowrap}
.vl input{width:66px}
.pel{margin:-2px 0 8px 2px}
.pel .nw{white-space:nowrap}
.pel b[data-pev],.pel b[data-qpev]{display:inline-block;min-width:1.6em;text-align:center}
.spl{display:grid;grid-template-columns:minmax(0,1fr);column-gap:28px}
/* Armas e armaduras: nome em cima; tipo, categoria, nível e bônus embaixo */
.eqr{display:grid;gap:6px;align-items:center;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr) auto;grid-template-areas:"n n n x" "t c l r"}
.eqr>:nth-child(1){grid-area:n}.eqr>:nth-child(2){grid-area:t}.eqr>:nth-child(3){grid-area:c}.eqr>:nth-child(4){grid-area:l}
.eqr>:nth-child(5){grid-area:r;white-space:nowrap}.eqr>:nth-child(6){grid-area:x;justify-self:end}

/* Tela de toque (celular e tablet) */
@media (pointer:coarse){
 input,select,textarea{font-size:16px}
 button{min-height:36px}
 .pel button{min-width:38px}
 .sp{grid-template-columns:minmax(0,1fr) 142px 46px}
}

/* Celular */
@media (max-width:599px){
 header{padding:8px 12px;gap:8px}
 h1{font-size:16px}
 main{padding:10px}
 .card{padding:10px;margin-bottom:10px}
 .eqr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:"n n x" "t c c" "l r r"}
 .ext{display:grid;grid-template-columns:minmax(0,1fr)}
 .eqpk{display:grid;grid-template-columns:80px minmax(0,1fr)}
 .eqpk>select{grid-column:1/-1}
 .pel{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:2px}
 .pel .sep{display:none}
 .vl th,.vl td{padding:6px 3px}
 .vl input{width:60px}
}
/* Celular pequeno (até 359px) */
@media (max-width:359px){
 .g{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
 .sp{grid-template-columns:minmax(0,1fr) 118px 40px}
 .vl th,.vl td{padding:5px 2px}
 .vl input{width:54px}
}

/* Tablet */
@media (min-width:600px) and (max-width:1023px){
 main{max-width:none;padding:16px 20px}
 header{padding-inline:20px}
}
@media (min-width:600px){
 #lst{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}

/* Computador: status à esquerda; especialidades, equipamentos e habilidades à direita */
@media (min-width:1024px){
 main{max-width:1320px;padding:20px 24px}
 header{padding-inline:max(24px,calc((100% - 1320px) / 2 + 24px))}
 .sheet{display:grid;grid-template-columns:minmax(390px,2fr) minmax(0,3fr);grid-template-rows:repeat(7,auto) 1fr;gap:12px 18px;align-items:start}
 .sheet>*{grid-column:1;margin:0}
 .sheet>.sh-r{grid-column:2;grid-row:1/-1}
}
/* Especialidades em duas colunas: tablet a partir de 720px e computador a partir de 1280px */
@media (min-width:720px) and (max-width:1023px),(min-width:1280px){
 .spl{grid-template-columns:repeat(2,minmax(0,1fr))}
 .spl .pel{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;row-gap:2px}
 .spl .pel .sep{display:none}
}
</style>
</head>

 nas suas perseguições contra ele até o final do combate para cada ação.","ph":1},{"id":"21","c":2,"n":"Primeiras perseguições","d":"Você recebe +1 em acerto em suas perseguições e recebe uma perseguição."},{"id":"22","c":2,"n":"perseguidor de seguimento","d":"Você pode usar uma ação de movimento durante seu turno para se aproximar de um alvo repelido."},{"id":"31","c":3,"n":"Perseguição extra","d":"Você pode usar uma perseguição a mais por turno."},{"id":"32","c":3,"n":"mais uma vez","d":"você pode utilizar uma perseguição mais uma vez no turno."},{"id":"33","c":3,"n":"perseguição por combo","d":"a cada quando 10 sequência de combos poderá usar uma ação livre para atacar com um soco básico."},{"id":"34","c":3,"n":"Perseguição constantemente","d":"você recebe +1 em AG ou FC (pode adquirir novamente essa habilidade a cada 5 pontos gastos nessa linha)","r":[5,5]},{"id":"35","c":3,"n":"Perseguição fluida","d":"para cada perseguição que acertou na rodada anterior ganhe +1 de CA (máximo 3)"},{"id":"36","c":3,"n":"Golpe oportunista","d":"você ganha o Golpe oportunista uma perseguição única só dessa linha. Golpe oportunista: uma persegue combo 5 atacando rapidamente com o que estiver disponível que não custe mais de uma ação causando o dano o dano do ataque (pode ser adquirido mais duas vezes conseguindo perseguir com combo 10 na segunda vez e combo 15 na terceira)","m":3},{"id":"41","c":4,"n":"perseguidor consistente","d":"Suas perseguições causam +1 de dano"},{"id":"42","c":4,"n":"perseguidor sortudo","d":"uma vez por turno quando seu dado não for o suficiente para continuar uma perseguição, poderá rerolar o dado mais baixo e substituir o valor dele."},{"id":"43","c":4,"n":"Golpe Aéreo","d":"Persegue alvos em \"flutuação\" com um ataque corpo a corpo que causa +1d6 de dano adicional."},{"id":"51","c":5,"n":"Especialista em perseguição (ataque)","d":"Você inibe a resistência a perseguição contra seus ataques."}]},{"id":"agarrador","n":"Agarrador","p":0,"nt":"","a":[{"id":"11","c":1,"n":"Imobilizador","d":"Com uma ação de agarrar em um inimigo já agarrado poderá imobilizar o alvo.","ph":3},{"id":"12","c":1,"n":"Primeiras agarradas","d":"Você recebe 1+ em agarrões e a perseguição segurar."},{"id":"13","c":1,"n":"Primeiras amarrações","d":"Você recebe +2 em todas as perseguições de agarrar."},{"id":"21","c":2,"n":"Bate Bate","d":"Você recebe a perseguição Russian Suplex ou jogar para cima(pode ser obtido duas vezes).","m":2},{"id":"22","c":2,"n":"Segura rápido!!!","d":"Não gaste ações para usar a perseguição segura."},{"id":"23","c":2,"n":"Profissão extra","d":"Você recebe uma profissão extra."},{"id":"24","c":2,"n":"Liso","d":"recebe +1 em todos os testes para se soltar de uma agarração."},{"id":"25","c":2,"n":"Chute Direcionado","d":"Chute Direcionado (1 ponto de habilidade) Um ataque que causa \"queda\" tem chance de também \"imobilizar\" o alvo (teste resistido de FC contra AG).","ph":1},{"id":"26","c":2,"n":"Golpe Direcionado","d":"Um ataque que causa queda pode ser seguido imediatamente pela perseguição Queda Voadora (dificuldade 10, dano 2d6).","ph":1},{"id":"27","c":2,"n":"Segurando forte","d":"você recebe +1 em FC"},{"id":"28","c":2,"n":"Não passa ninguém","d":"você receber uma ação ofensiva sempre que alguém tentar sair do seu alcance de ataque corpo a corpo"},{"id":"31","c":3,"n":"Cabeçada","d":"ao final do turno, se estiver segurando algo, você recebe uma ação extra para dar uma cabeçada no alvo."},{"id":"32","c":3,"n":"Pancada Brutal","d":"Se causar \"queda\" ao usar \"Russian Suplex\", o alvo sofre +1d6 de dano adicional."},{"id":"33","c":3,"n":"Segurando apertado","d":"você recebe +1 em FV"},{"id":"34","c":3,"n":"Spear","d":"você ganha Spear um ataque único só dessa linha Spear: você corre 2 quadrados no mínimo e se joga na barriga do alvo com grande chance de causar queda."},{"id":"35","c":3,"n":"RKO","d":"você ganha o RKO um ataque único só dessa linha. RKO: você fica atrás ou ao lado do oponente não mais que 1 metro maior que você. Você salta no ar, agarrando o pescoço ou a cabeça do adversário com o braço. No meio do salto, você puxa o oponente para baixo com força. Os dois caem juntos no chão, e o rosto ou queixo do oponente acerta o chão, como se fosse uma batida seca. Esse golpe causa mais 1d6 de dano bônus em um chão de madeira ou similar, 2d6 em um chão de pedra ou similar ou 3d6 em um chão de pedra ou superior desnivelado, você recebe o dano igual ao bônus de dano menos 1d6."},{"id":"36","c":3,"n":"Powebomb","d":"você ganha o powerbombw ataque único só dessa linha. Powerbomb: com o oponente nos ombros, sentado. Então é erguido e jogado de costas contra o chão. A cada metrô que estiver do chão a partir de 1 metrô ganha um bônus de dano de 1d6, você recebe o dano bônus menos 2d6."},{"id":"37","c":3,"n":"Pedigree","d":"você ganha o Pedigree, um ataque único só desta linha Pedigree: quando um inimigo corre na sua direção e te ataca, como uma perseguição ME encaixe os braços sob os do adversário e segure sua cabeça, dê um pequeno salto e empurre-o de frente contra o chão, controlando a queda com os braços, grande chance de causar queda. Este golpe causa +1d6 em terreno macio; +2d6 em piso duro; +3d6 em superfícies irregulares, mais 1d6 a cada meio metro que cair, você ainda recebe 1d6 de dano de queda/concusao nas pernas a cada metro a partir de 2 metros."},{"id":"41","c":4,"n":"Agarre de oportunidade","d":"Quando um alvo sair do seu alcance corpo a corpo, você recebe uma ação para gastar em agarrar."},{"id":"42","c":4,"n":"Protetor Forte","d":"Você pode usar um inimigo \"agarrado\" como escudo, redirecionando ataques para ele (teste resistido de FC). Estrangulador (1 pontos de habilidade) Inimigos que você \"imobilizar\" começam a perder 1d6 de vida por turno devido à asfixia (teste resistido de RS para evitar o efeito no final do turno).","ph":2},{"id":"43","c":4,"n":"Segurando muito apertado","d":"você recebe +1 em FC"},{"id":"51","c":5,"n":"Jiboia agarradora","d":"durante seu turno você tem +1 em todas as formas de agarrar e imobilizar."}]},{"id":"guerreiro","n":"Guerreiro","p":0,"nt":"","a":[{"id":"11","c":1,"n":"Primeiras armas","d":"você ganha 5 pontos para gastar em perícias AAF, AAM e AAD(pode ser comprado mais uma vez a cada 3 pontos gastos nessa linha)","r":[3,3]},{"id":"12","c":1,"n":"ataque concentrado","d":"você gasta até 3 ações para fazer um ataque que causa dano igual o dano da arma multiplicado pelo número de ações gastas e com um bônus de acerto de +1 por cada ação gasta.","ph":1},{"id":"13","c":1,"n":"escudeiro","d":"você aprende a utilizar escudos."},{"id":"14","c":1,"n":"Pequenos ferimentos","d":"você causa +1 de dano em acertos por poucos."},{"id":"15","c":1,"n":"Médios ferimentos","d":"você causa +1 de dano em acertos normais."},{"id":"16","c":1,"n":"Grandes ferimentos","d":"você causa +2 de dano em acertos críticos."},{"id":"17","c":1,"n":"Guarda de guerreiro","d":"você ganha mais 1 de CA quando levanta a guarda."},{"id":"21","c":2,"n":"Mestre em lâminas cortantes","d":"você obtém um bônus de +1 em acerto e dano de ataques cortantes com lâminas."},{"id":"22","c":2,"n":"Mestre em lâminas perfurantes","d":"você obtém um bônus de +1 em acerto e dano de ataques perfurantes com lâminas."},{"id":"23","c":2,"n":"Mestre em contusões","d":"você obtém um bônus de +1 em acerto e dano de ataques de contusão."},{"id":"24","c":2,"n":"Pose de contra-ataque","d":"Você utiliza uma ação para entrar na pose de contra-ataque, enquanto estiver nessa pose uma vez que um inimigo errar um ataque, você poderá realizar uma ação de ataque corpo a corpo no seu atacante sem gastar ações caso esteja com alcance para isso (até duas vezes por turno)."},{"id":"25","c":2,"n":"Posicionamento Tático","d":"Posicionamento Tático (1 ponto de habilidade) Após um ataque bem-sucedido, você pode se mover um quadrado sem provocar ataques de oportunidade.","ph":1},{"id":"26","c":2,"n":"Mestre paciente","d":"Você pode guardar duas ações para utilizar fora do seu turno, até o início do seu próximo turno como defesa ativa ou um ataque ofensivo."},{"id":"27","c":2,"n":"Guerreiro forte","d":"você recebe +1 em AG ou FC."},{"id":"28","c":2,"n":"Não passa ninguém","d":"você receber uma ação ofensiva sempre que alguém tentar sair do seu alcance de ataque corpo a corpo"},{"id":"31","c":3,"n":"Aparador","d":"se estiver em guarda com uma arma na mão seu bônus de classe de acerto aumenta para +2 até você receber seu primeiro ataque, esse bônus volta sempre que entrar em guarda novamente."},{"id":"32","c":3,"n":"Pose pesada","d":"você usa a ação para entrar em guarda mas entra em pose pesada, até o fim do turno seus ataques tem o dobro do bônus de FC ou AG e tem um bônus de +5 no dano, porém você tem uma penalidade de -5 no bônus de acerto (esse valores não podem ser alterados)."},{"id":"33","c":3,"n":"Guerreiro implacável","d":"você recebe +2 em FC ou +1 em AG."},{"id":"34","c":3,"n":"Ofensiva seguradora","d":"sempre que usar um ataque ofensivo e acertar reduz o deslocamento do alvo em 5 em todas as ações dele até o final do turno turno do alvo."},{"id":"35","c":3,"n":"Não aproxima ninguém","d":"sempre que alguém entrar no alcance de ataque corpo a corpo ganhe uma ação ofensiva."},{"id":"36","c":3,"n":"Guerreiro armado","d":"se estiver vestido mais que 3kg de armadura no total receba +2 de CA."},{"id":"37","c":3,"n":"Perseguição desarme","d":"você ganha o Perseguição desarme uma perseguição única só dessa linha. Perseguição Desarme: persegue quebra de defesa com baixa chance de derrubar a desarmar do alvo. Você aproveita a baixa defesa do alvo para tentar pegar desarmar o alvo."},{"id":"41","c":4,"n":"Armadura resistente","d":"enquanto estiver vestindo uma armadura sua Mitigação aumenta em 1 na sua armadura."},{"id":"42","c":4,"n":"Provocar","d":"uma vez por turno você pode redirecionar um ataque para você antes do atacante rolar os dados.","ph":1},{"id":"43","c":4,"n":"Guerreiro místico","d":"você pode usar as habilidades da linha de prestígio guerreiro místico"},{"id":"44","c":4,"n":"Pose de contra-ataque aprimorada","d":"você pode usar o contra ataque da pose de contra-ataque até 6 vezes por turno."},{"id":"45","c":4,"n":"Domínio de Impacto","d":"Domínio de Impacto (1 pontos de habilidade) Quando usar uma arma de contusão, adicione +1 ao dano e certo com chance de \"quebra de defesa\".","ph":1},{"id":"46","c":4,"n":"Domínio do Impacto","d":"Você adquire a perseguição Super soco. Quando usar uma arma de contusão, adicione +1 ao dano e acerto. Além disso, ataques que causem quebra de defesa podem ser seguidos pela perseguição Super Soco (dificuldade 7, dano 1d6 + FC)."},{"id":"51","c":5,"n":"Atacante preciso","d":"para conseguir um acerto normal você precisa tirar apenas 3 a mais que a classe de acerto."},{"id":"52","c":5,"n":"Ataque brutal","d":"você desfere um ataque brutal, onde qualquer acerto causará o mesmo dado de 10d6 mais o dano da arma, durante o resto do turno não poderia realizar mais ações.","ph":5},{"id":"53","c":5,"n":"Guardião de Batalha","d":"Guardião de Batalha (3 pontos de habilidade) pré-requisito pose de contra-ataque. Enquanto estiver em \"Pose de Contra-ataque\", você pode proteger aliados adjacentes, redirecionando ataques para você com +2 na sua classe de acerto contra esses ataques.","ph":3},{"id":"54","c":5,"n":"Finalizando o treinamento","d":"se tiver menos que 5 em AG ou AC adicione até +3 nesse atributo ficando no máximo com +5."}]},{"id":"louco","n":"Louco","p":0,"nt":"","a":[{"id":"11","c":1,"n":"Inconsequente","d":"Você pode reduzir até dois pontos de ca e adicionar o dobro no dano de ataque corpo a corpo."},{"id":"12","c":1,"n":"Improvisando","d":"você ganha 5 pontos para gastar em perícias AAF ou armas improvisadas.(pode ser comprado mais uma vez a cada 3 pontos gastos nessa linha)","r":[3,3]},{"id":"21","c":2,"n":"Contra ataque louco","d":"Uma vez por turno, quando um inimigo errar um ataque contra você, você pode optar por não esquivar e receber o dano. Ao fazer isso, você ganha uma ação extra para atacar imediatamente o inimigo."},{"id":"22","c":2,"n":"Tudo ou nada","d":"uma vez por turno faça o dobro das jogadas para uma ação, só a rolagem com o resultado dos dados mais distante de 7 será contabilizado, em caso de empate role novamente."},{"id":"23","c":2,"n":"Apressado","d":"você pode gastar as ações do seu turno seguinte antecipadamente, para cada ação gasta apressadamente custa duas vezes mais em ações do turno seguinte, essas ações serão reduzidas das suas ações do turno seguinte."},{"id":"24","c":2,"n":"Apenas força","d":"apenas umas vez sacrifique 1 de AG para ganhar 1 de FC (pode adquirir essa habilidade novamente a cada 3 pontos gastos nessa linha)","r":[3,3]},{"id":"25","c":2,"n":"ataque de sacrifício","d":"você ganha o ataque de sacrifício um ataque único só dessa linha. Ataque de sacrifício: você escolhe uma parte do corpo para sacrificar em troca de um bônus alto de acerto de +4 para um acerto normal e reduz em 1 o valor do dado para acerto critico e aumenta em 1 para erro crítico para além disso o seu alvo receberá uma AO para usar imediatamente contra você."},{"id":"31","c":3,"n":"Pose pesada","d":"você usa a ação para entrar em guarda mas entra em pose pesada, até o fim do turno seus ataques tem o dobro do bônus de FC ou AG e tem um bônus de +5 no dano, porém você tem uma penalidade de -5 no bônus de acerto."},{"id":"32","c":3,"n":"sanguíneo","d":"Ao atacar um alvo que esteja sangrando você pode causar mais 1d6 de dano."},{"id":"33","c":3,"n":"Fúria Descontrolada","d":"Fúria Descontrolada (3 pontos de habilidade) Gaste todos os seus pontos de habilidade acumulados. Cada ponto gasto concede +2 de dano adicional ao seu próximo ataque.","ph":3},{"id":"34","c":3,"n":"Rebote Doloroso","d":"Quando for acertado por um ataque corpo a corpo, você pode gastar uma ação e realizar imediatamente um ataque corpo a corpo básico contra o agressor."},{"id":"35","c":3,"n":"Assassinato Preciso","d":"","ph":2},{"id":"36","c":3,"n":"Só força","d":"reduza um atributo a sua escolha em 1 e ganhe mais 1 de FC."},{"id":"37","c":3,"n":"Ofensiva da ofensiva","d":"sempre que alguém errar um ataque ofensivo em você, receba uma ação ofensiva."},{"id":"41","c":4,"n":"Ciumento","d":"Você marca um alvo como seu inimigo de estimação, sempre que ele atacar outro alvo você poderá fazer um ataque contra ele que gaste uma ação imediatamente mesmo fora do seu turno sem gastar ações. Enquanto você estiver usando a habilidade Ciumento você não poderá ganhar pontos de habilidade.","ph":2},{"id":"42","c":4,"n":"Desafio Mortal","d":"Escolha um alvo e desafie-o com um ataque corpo a corpo. Ambos ganham +2 em acerto e +2 em dano contra o outro até que um dos dois caia a 0 pontos de vida.","ph":2},{"id":"43","c":4,"n":"Explosão de Loucura","d":"Explosão de Loucura (3 pontos de habilidade) Consome todas as suas ações do turno para soltar uma explosão de energia louca em um raio de 3 quadrados ao seu redor. Todos os inimigos na área fazem um teste resistido de RS contra sua FC. Falhar resulta em 2d6 de dano de contusão e queda.","ph":3},{"id":"44","c":4,"n":"Força imprudente","d":"uma vez a cada 3 horas sacrifique seu AG para ganhar FC durante 1 hora a cada AG sacrificado você ganha 2 FC"},{"id":"51","c":5,"n":"Grito do insano","d":"Você solta um grito aterrorizador você roda uma única rolagem de intimidação contra o teste de SB de todos que conseguem ouvir em 10 quadrados, todos que falharem ficaram com medo de você. Você terá dois turnos seguidos para atacar com suas ações e terá mais 5 em todos os teste de resistência de sobrevida. após isso você vai ficar o próximo turno sem conseguir realizar ações e com -2 na sua classe de acerto e no turno seguinte poderá atacar com menos 2 no acerto e no dano (a cada vez que usar isso sem dormir por pelo menos 8 horas terá a redução de classe de acerto, dano e acerto aumentada em 1)."},{"id":"52","c":5,"n":"Coração da Loucura","d":"Coração da Loucura (4 pontos de habilidade) Você entra em um estado de insanidade pura. Por 3 turnos, ganha +3 em todos os testes de acerto e dano, mas não pode usar ações de defesa ativa. Após o efeito, você sofre 1d6 de dano para cada turno que permaneceu nesse estado.","ph":4},{"id":"53","c":5,"n":"Anarquia Total","d":"Durante seu turno, você pode atacar aleatoriamente qualquer criatura (aliados e inimigos) em um raio de 5 quadrados. Cada ataque tem um bônus de +5 no acerto e causa +2d6 de dano adicional. Após o ataque, você sofre -5 em sua classe de acerto até o início do próximo turno.","ph":5},{"id":"54","c":5,"n":"Equilíbrio entre força e agilidade","d":"aproxime seu atributo de AG do seu FC ganhando até +5 de AG sem seu AG superar seu FC, esse efeito é suspenso por enquanto sua vida estiver em 0 e até um dia inteiro depois de sua vida ficar superior a 0 ou ficar inconsciente involuntariamente ou de formas não naturais."}]},{"id":"sutil","n":"Atacante Sutil","p":0,"nt":"","a":[{"id":"11","c":1,"n":"Primeiras sutilidades","d":"Você ganha 5 pontos para gastar em perícias de furtividade, tecnologia, velocidade ou manipulação (pode ser comprado mais uma vez a cada 3 pontos gastos nessa linha)","r":[3,3]},{"id":"12","c":1,"n":"Toque sutil","d":"caso consiga um acerto normal ou superior em um ataque ele poderá não fazer som"},{"id":"13","c":1,"n":"Assassinato","d":"caso o alvo esteja inconsiente ou distraido seus ataques causaram o dobro de todos os dano."},{"id":"14","c":1,"n":"Tiro certeiro","d":"Você tem +2 de acerto no seu próximo ataque neste turno.(pode ser usada até 2 vezes um único ataque).","ph":1},{"id":"21","c":2,"n":"Fugitivo","d":"Você consegue a profissão fugitivo, caso já tenha você ganha +8 pontos para gastar em furtividade ou velocidade."},{"id":"22","c":2,"n":"Ataque certeiro","d":"ao tentar atacar o pescoço terá uma redução de 2 dos acréscimos da classe de acerto do oponente."},{"id":"23","c":2,"n":"Camuflagem sutil","d":"Caso utilize tempo para se camuflar terá um acréscimo nos seus teste de furtividade de +2."},{"id":"24","c":2,"n":"Esquiva sútil","d":"caso não tenha gasto toda sua movimentação poderá usar uma ação de defesa ativa a cada 2 quadrados não gastos."},{"id":"25","c":2,"n":"Não passa ninguém","d":"você receber uma ação ofensiva sempre que alguém sair do seu alcance de ataque corpo a corpo"},{"id":"26","c":2,"n":"Velocista ágil","d":"você pode usar todos seu AG como bônus de velocidade ao invés de da média de AG e FC."},{"id":"31","c":3,"n":"Ataques simultâneos","d":"Caso esteja empunhando mais de uma arma, poderá fazer dois ataques ao mesmo tempo com só uma rolagem de ataque que terá um acréscimo na classe de acerto do alvo de +1."},{"id":"32","c":3,"n":"Veloz","d":"Você tem sua velocidade aumentada em 3 quadrados"},{"id":"33","c":3,"n":"Salto alto","d":"você tem seu salto aumentado em 2 quadrados"},{"id":"34","c":3,"n":"Mestre em Shuriken","d":"Você pode jogar 2 Shuriken com uma ação."},{"id":"35","c":3,"n":"Sempre sutil","d":"ganhe +2 em todas as suas especializações que possui que usam AG."},{"id":"41","c":4,"n":"Serial-killer","d":"Ao reduzir o pontos de vida de um alvo a 0 você recuperar a número de ações gasta no último ataque (pode ser usada até 3 vezes por turno)"},{"id":"42","c":4,"n":"Pontos mortais","d":"ao acertar alvos no pescoço, cabeça, olhos ou em outros pontos vulneráveis causará mais 2d6 de dano."},{"id":"43","c":4,"n":"Pisando em ovos","d":"por ataque você pode reduzir seu bônus de acerto feito em um ataque em 1 e adicionar a seu dano."},{"id":"44","c":4,"n":"Sempre furtivo","d":"enquanto estiver furtivo e seus inimigos não estiverem visto você sua agilidade aumenta em +3, esse bônus reduz para +1 no primeiro minuto que estiver sido avistado."},{"id":"45","c":4,"n":"Brutalizar","d":"você ganha o Brutalizar um ataque único só dessa linha. Brutalizar: quando faz um ataque furtivo pode também usar brutalizar usando 2 ações para fazer 4 golpes no alvo sendo no máximo 2 deles na mesma parte do corpo, isso espirra muito sangue e faz barulho causando -5 em furtividade caso queira fazer o teste e te deixa manchado de sangue."},{"id":"51","c":5,"n":"Assassinato em massa","d":"Seus ataques tem mais 6 de acerto durante esse turno toda criatura que não tenha resistencia contra essa habilidade sempre que sua vida chegar a 0 ou inferior por um ataque seu morre instantaneamente.","ph":3},{"id":"52","c":5,"n":"Coletor de pontos","d":"Sempre que você levar uma criatura a 0 pontos de vida ou inferior você receberá um ponto de habilidade"},{"id":"53","c":5,"n":"Sábio do Shuriken","d":"Pré-requisito: Mestre em Shuriken. Você pode jogar 3 Shuriken com uma ação."}]},{"id":"maestro","n":"Maestro","p":0,"nt":"Fazer música gasta 3 ações.","a":[{"id":"11","c":1,"n":"Hablador","d":"você tenha 5 pp para gastar em persuadir ou mentir. (pode ser adquirido novamente a cada 5 pontos gastos nessa linha)","r":[5,5]},{"id":"12","c":1,"n":"Poliglota","d":"você aprende um idioma a sua escolha (pode ser adquirido novamente a cada 5 pontos gastos nessa linha)","r":[5,5]},{"id":"13","c":1,"n":"Músico","d":"você aprende a tocar um instrumento e enquanto canta ganha +2 em atuar."},{"id":"14","c":1,"n":"Cantor","d":"você aprende a cantar bem e enquanto canta ganha +2 em atuar."},{"id":"15","c":1,"n":"Pintor","d":"você aprende a pintar."},{"id":"21","c":2,"n":"Sonata inspiradora","d":"enquanto você está tocando/cantando todos os seus aliados em até 30 metros de distância tem +2 em perícias."},{"id":"22","c":2,"n":"Música de guerra","d":"Música de guerra(pré requisito habilidades de cantar/tocar): enquanto você está cantando/tocando seus aliados em até 9m tem +2 de acerto em seus ataques."},{"id":"23","c":2,"n":"Música de guerra alta(pré requisito","d":"música de guerra): sua música de guerra tem o alcance de 30m."},{"id":"24","c":2,"n":"Tema de proteção","d":"Tema de proteção (pré requisito habilidades de cantar/tocar): você canta uma canção que aumenta a CA dos aliados em até 9m em 1."},{"id":"25","c":2,"n":"Pintura mística(pré requisito","d":"saber pintar): você gasta 5c e 5 minutos em materiais de pintura para pintar um desenho em cima de um ferimento e ele é estancando magicamente."},{"id":"26","c":2,"n":"Música inspiradora","d":"Música inspiradora (pré requisito habilidades de cantar/tocar e 2 ponto de habilidade): você canta/toca com mais vigor e durante uma ação um aliado tem +2."},{"id":"31","c":3,"n":"Banda de uma pessoa só","d":"se você cantar e tocar a mesma música ao mesmo tempo os bônus concedidos por você aumentam em 1."},{"id":"32","c":3,"n":"Runas sagradas","d":"você gasta 1 hora e 50c em materiais de pintura sagrada para pintar runas grandes em volta de uma parte do corpo de uma criatura ela recebe +1 de mitigação por 1 ano quando a tinta sai."},{"id":"41","c":4,"n":"Maestro de multidões","d":"você consegue fazer com que multidões não treinadas cantem músicas perfeitamente. 5 pessoas cantam a música normalmente. 15 pessoas cantam a música com +1 de bônus. 50 pessoas cantam a música com +2 de bônus."},{"id":"42","c":4,"n":"Maestro de profissionais","d":"você consegue fazer com que multidões treinadas cantem canções com mais efetividade. 3 pessoas cantam com +1 8 pessoas cantam com +2 20 pessoas cantam com +3 50 pessoas cantam com +4"},{"id":"43","c":4,"n":"Ópera Defensiva","d":"Você gasta 3 ações para criar uma barreira de ressonância no campo de batalha. Até o início do seu próximo turno, todos os aliados que puderem ouvi-lo recebem +2 na Classe de Acerto (CA) contra o primeiro ataque que sofrerem na rodada."},{"id":"51","c":5,"n":"Opus Magna (Passiva)","d":"Você domina a arte de sobrepor melodias complexas. Você ganha a capacidade de tocar e manter simultaneamente duas habilidades musicais de categorias inferiores (por exemplo, \"Hino de Batalha\" e \"Ópera Defensiva\") gastando as mesmas 3 ações padrão."},{"id":"52","c":5,"n":"Crescendo de Execução","d":"Você foca sua música em um ritmo fatal que acelera a queda dos inimigos. Todos os oponentes a até 5 quadrados de distância que estiverem na zona de sobrevida ou com menos de 10% da vida sofrem uma penalidade drástica de -3 em seus testes de Resistência (RS) contra morte ou condições, enquanto a música durar."},{"id":"53","c":5,"n":"Virtuose Intocável (Passiva)","d":"Tocar ou manter uma música normalmente gasta as 3 ações do seu turno. Ao atingir este ápice, você reduz o custo de ativação e manutenção de qualquer performance musical para apenas 2 ações. Isso deixa 1 ação livre por turno para se mover, usar itens ou realizar defesas ativas, mantendo os buffs da equipe ininterruptos."}]},{"id":"gmistico","n":"Guerreiro Místico","p":1,"nt":"Prestígio · pré-requisito: habilidade Guerreiro místico da linha do Guerreiro. Vai só até a Categoria 3.","a":[{"id":"11","c":1,"n":"benção primária","d":"você pode ungir sua espada com energia mística causando mais 1d6 de dano místico nos alvos nos próximos 2 acertos durante 2 turnos.","ph":2},{"id":"21","c":2,"n":"Proteção mística","d":"Proteção mística(3 pontos de habilidade)você ganha mais 3 de Mitigação contra dano contra dano de contusão, cortante e perfurante durante 1 minuto.","ph":3},{"id":"22","c":2,"n":"Aura de paz","d":"Quando fora de combate às pessoas ao seu redor reduzem a agressividade, todos de outros tirando você, os testes para iniciar um combate tem -3 nas suas rolagens."},{"id":"23","c":2,"n":"Encarnação divina","d":"Encarnação divina(3 pontos de habilidade (necessário um item valioso a ser consumido): Durante 10 turnos, você adquire todas as habilidades físicas e mágicas de um inimigo derrotado no último ano, desde que o nível desse inimigo não exceda o dobro do seu nível. É necessário ter uma parte do inimigo (exemplo: osso, sangue, pele , chifre ou qualquer outra parte do corpo que pese pelo menos 50 gramas) no seu inventário para ativar a habilidade. Item valioso: algo que custa realmente muito caro para o personagem ou algo único (ou seja só uma coisa especial e insubstituível) que tem um valor sentimental inigualável, gastar um item valioso sentimental (ou seja não por valor monetário) sempre leva o personagem a uma tristeza muito intensa, geralmente leva a depressão. Antes de usar a habilidade converse com o mestre se aquilo é considerado um como item valioso, um item valioso pode custar valores diferentes de acordo com a condição financeira do personagem. Um item valioso não está limitado a coisas inanimadas e sem consciência, qualquer coisa pode ser um item valioso desde que tenha emoção o suficiente sobre ela. Criando um item valioso. Para criar um item valioso terá que ter a sorte de encontrar algo que você considere tão importante como o anterior, ele vai necessitar de uma justificativa boa, uma história intensa e grande e muito tempo, recomendo no mínimo 5 anos. Ou simplesmente gosta toda a economia de sua vida (economia de economizar mesmo, guardar 5c por mês não conta, a não ser que seja realmente muito pobre) em algo caro, isso também serve.","ph":3}],"u":["guerreiro","43"]},{"id":"espelem","n":"Espadachim Elementalista","p":1,"nt":"Prestígio · pré-requisito: habilidade Espadachim Elementalista da linha do Guerreiro. Vai só até a Categoria 3.","a":[{"id":"11","c":1,"n":"Espada Elemental","d":"Espada Elemental (1 pontos de habilidade) Você pode imbuir sua arma com um dos elementos que você conhece. O ataque causa +1d6 de dano elemental por 2 turnos. O tipo de elemento pode ser escolhido no momento da ativação. Enquanto essa habilidade estiver ativa gastará 1EA por turno.","ph":1},{"id":"12","c":1,"n":"Reflexo Arcano","d":"Você recebe +1 na classe de acerto contra magias inimigas enquanto estiver empunhando uma arma."},{"id":"21","c":2,"n":"Ataque Elemental Ampliado","d":"Ataque Elemental Ampliado (1 pontos de habilidade) Ao usar a habilidade \"Espada Elemental\", você pode adicionar um foco de potência ao ataque sem custo de ação adicional.","ph":1},{"id":"22","c":2,"n":"Combate Energizado","d":"Você pode gastar 1 ação para realizar um ataque que empurra o alvo 2 quadrados e causa dano elemental equivalente ao seu bônus de Intelecto (IT)."},{"id":"23","c":2,"n":"Pulso Elemental","d":"Você canaliza a energia elemental em sua arma para criar um impacto de área. Com uma ação, você libera um pulso em um raio de 2 quadrados ao seu redor, causando 1d6 de dano elemental a todos os inimigos atingidos. O tipo de elemento pode ser escolhido no momento da ativação, com base nos elementos que você conhece. Inimigos no alcance devem fazer um teste resistido de RS contra IT para evitar serem empurrados 1 quadrado para trás.","ph":2},{"id":"31","c":3,"n":"Impacto Elemental","d":"Quando realizar um acerto crítico com uma arma imbuída por \"Espada Elemental\", cause uma explosão de 3 quadrados de raio. A explosão inflige metade do dano da arma mais o dano elemental em todos os inimigos na área."},{"id":"32","c":3,"n":"Canalizador Elementalista","d":"Mesclador de Elementos 1 (Custo: 1 ponto de habilidade por ativação.) Você pode conjurar combinações de dois elementos conhecidos e aplicá-las à sua arma, seguindo as regras padrão de conjuração. A arma permanece imbuída com os elementos combinados por 3 turnos, causando +2d6 de dano elemental adicional nos ataques. Dependendo da combinação, ataques com a arma podem causar efeitos secundários: Fogo: Causa queimadura no alvo (1d6 de dano por turno por 2 turnos, pode ser apagado com uma ação). Gelo: Reduz o deslocamento do alvo em 2 quadrados por turno, por até 3 turnos. Ar: Empurra o alvo 2 quadrados. Terra: Cria terreno difícil ao redor do ponto de impacto por 1 turno. Restrição: Não pode ser ativado enquanto outra habilidade de fusão ou conjuração estiver ativa na mesma arma.","ph":1}]},{"id":"elem","n":"Elementalista","p":0,"nt":"Linha mágica: cada habilidade conta para EA (+2 EA por habilidade em linha mágica).","a":[{"id":"11","c":1,"n":"Iniciado em magia (obrigatório)","d":"você ou o mestre escolhe ou sorteia um elemento entre fogo, água, terra e ar para você adquirir."},{"id":"12","c":1,"n":"Magias precisas 1","d":"você tem mais 1 em dano e acerto e em testes de jogar magias."},{"id":"13","c":1,"n":"Energizado","d":"Você recebe +10 de energia arcana. (pode adquirir essa habilidade novamente a cada 3 pontos gastos nessa linha)","r":[3,3]},{"id":"21","c":2,"n":"Elementalista potente","d":"você pode usar o foco de potência sem gastar ações."},{"id":"22","c":2,"n":"Extrator de energia","d":"você pode extrair a energia do seu elemento caso esteja a 3 quadros de distância ou menos você ganha um bônus de mais 2 nos testes de concentração e mais 1 em dano e acerto com magias daquele elemento."},{"id":"23","c":2,"n":"Sábio","d":"você ganha +1 em IT (pode adquirir novamente a pôs 5 pontos nessa árvore, e depois disso a cada 4 pontos gastos nessa árvore)","r":[5,4]},{"id":"31","c":3,"n":"Mesclador de elementos 1","d":"você pode combinar dois elementos para fazer um foco principal."},{"id":"32","c":3,"n":"Iniciado em magia 2","d":"você ou o mestre escolhe ou sorteia um elemento entre fogo, água, terra e ar que você não tenha para adquirir."},{"id":"33","c":3,"n":"Carvão instável","d":"agora você pode combinar madeira com fogo e ao invés de fazer carvão pode fazer carvão instável com propriedades explosivas."},{"id":"34","c":3,"n":"Golpe Elemental","d":"Você adquire a perseguição Projeto Oportunista Flutuante. Ao usar uma magia que cause dano físico ou empurre o alvo (ex.: vento, água), você pode seguir imediatamente com a perseguição Projeto Oportunista Flutuante (dificuldade 10, dano 2d6) se o alvo for empurrado ou flutuado.","ph":2},{"id":"35","c":3,"n":"Magias preciosas 2","d":"você tem +1 em acerto para cada elemento adicionado na magia."},{"id":"36","c":3,"n":"Conectado com o arcano","d":"Você recebe +1 de energia arcana a cada vez que gastar toda sua energia arcana em um combate real não simulado conscientemente por você ou quer você saiba, apenas uma vez por semana até conseguir +10 com essa habilidade no total."},{"id":"37","c":3,"n":"Dois elementos em um","d":"Dois em elementos em um. Uma vez por turno, você consegue adicionar dois elementos na mesa mágica com uma só ação."},{"id":"41","c":4,"n":"Magia em conjunto","d":"Você pode colaborar com outro Elementalista para conjurar uma magia combinada. Ao fazer isso: Cada jogador canaliza um elemento. O jogador com o maior atributo Intelecto (IT) realiza o teste de concentração. Adicione +3 no teste de concentração realizado. Se um dos jogadores for interrompido, o teste é feito com uma penalidade de -2. O foco principal da magia é definido pelo jogador que inicia a conjuração, mas o foco de potência pode ser adicionado por qualquer um dos dois. Ambos gastam ações normalmente para canalizar seus respectivos elementos. O resultado da magia (dano, efeitos e alcance) combina os elementos de ambos os jogadores e segue as regras normais de magias combinadas"},{"id":"42","c":4,"n":"Conjurador focado","d":"você adquire mais 2 nos seus testes de concentração."},{"id":"43","c":4,"n":"Conjurador ambidestro","d":"você pode fazer duas combinações ao mesmo tempo, uma em cada mão, porém o acréscimo de de dificuldade de concentração ambas será somado."},{"id":"44","c":4,"n":"Transbordar de energia","d":"uma vez por turno com uma ação reduza a dificuldade em 1 da sua concentração atual gostando 2EA, caso use essa mesma habilidade na mesma magia o custo de EA por redução vai aumentar em 1."},{"id":"51","c":5,"n":"Mesclador de elementos 2","d":"você pode combinar três elementos para fazer um foco principal."},{"id":"52","c":5,"n":"Conjurador concentrado","d":"pode opcionalmente conjurar mais devagar para conseguir melhores resultados com bônus nas rolagens de concentração ao adicionar cada elemento: 1 minuto ganha +1, 5 minutos ganha +2, 15 minutos ganha +3, 30 minutos ganha +4, 1 hora ganha +5, 6 horas ganha +6, 12 horas ganha +7, um dia ganha +8, 3 dias ganha +9 e 7 dias ganha +10."},{"id":"53","c":5,"n":"Iniciado em magia 3","d":"você ou o mestre escolhe ou sorteia um elemento entre fogo, água, terra e ar que você não tenha para adquirir."},{"id":"54","c":5,"n":"Mesclador de magias","d":"você pode mesclar a seu conjunto de magia com o conjunto de magia de outro elementalista magia de outro elementalista, para isso faça o teste somente com a dificuldade total da magia, caso tenha a habilidade magia em conjunto pode usar as regras dela para te auxiliar."}]}];
const LNREQ={1:[0],2:[1],3:[3],4:[5,7],5:[8,12]},lnUI={only:false,open:{}};
const lnSpent=id=>Object.values(S.ln?.[id]||{}).reduce((a,b)=>a+(+b||0),0);
const lnTotal=()=>LN.reduce((s,l)=>s+lnSpent(l.id),0);
const lnPL=()=>5+Math.max(1,+S.nivel||1)+(+S.plx||0);
const lnOn=l=>!l.p||!!S.lnu?.[l.id]||!!(l.u&&S.ln?.[l.u[0]]?.[l.u[1]]>0);
const lnCatN=(l,c)=>l.a.filter(a=>a.c==c&&S.ln?.[l.id]?.[a.id]>0).length;
function lnWhy(l,a){
 const cnt=+S.ln?.[l.id]?.[a.id]||0,sp=lnSpent(l.id);
 if(S.lnf)return '';
 if(!lnOn(l))return 'Linha de prestígio bloqueada';
 if(lnPL()-lnTotal()<=0)return 'Sem PL disponíveis';
 if(!cnt){const n=a.c>3?lnCatN(l,a.c):0;if(n>=2)return 'Limite de 2 habilidades de Categoria '+a.c+' nesta linha';
  const need=LNREQ[a.c][n];return sp<need?'Requer '+need+' PL gastos na linha (você tem '+sp+')':''}
 if(a.m)return cnt>=a.m?'Máximo de '+a.m+' compras':'';
 if(a.r){const need=a.r[0]+(cnt-1)*a.r[1];return sp<need?'Nova compra requer '+need+' PL gastos na linha (você tem '+sp+')':''}
 return 'Já comprada';
}
function lnFeasible(l,o){
 const left=[];l.a.forEach(a=>{const k=+o[a.id]||0;for(let i=1;i<=k;i++)left.push({a,i})});
 let sp=0,cn={4:0,5:0},go=true;
 while(left.length&&go){go=false;
  for(let j=0;j<left.length;j++){const{a,i}=left[j],hi=a.c>3&&i==1;
   const need=i>1?(a.r?a.r[0]+(i-2)*a.r[1]:0):LNREQ[a.c][hi?Math.min(cn[a.c],1):0];
   if(sp>=need&&!(hi&&cn[a.c]>=2)){if(hi)cn[a.c]++;sp++;left.splice(j,1);go=true;break}}}
 return !left.length;
}
function lnBody(){
 return LN.map(l=>{
  const o=S.ln?.[l.id]||{},sp=lnSpent(l.id),on=lnOn(l);
  if(lnUI.only&&!sp)return '';
  const cats=[1,2,3,4,5].map(c=>{
   const it=l.a.filter(a=>a.c==c&&(!lnUI.only||o[a.id]>0));if(!it.length)return '';
   const n=c>3?lnCatN(l,c):0,need=LNREQ[c][Math.min(n,LNREQ[c].length-1)],ok=sp>=need&&n<(c>3?2:99);
   return `<div class="st" style="margin:10px 0 2px"><b>Categoria ${c}</b> · ${ok?'liberada':(n>=2?'limite atingido':'requer '+need+' PL na linha (faltam '+(need-sp)+')')}${c>3?' · '+n+'/2':''}</div>`+it.map(a=>{
    const k=+o[a.id]||0,why=lnWhy(l,a);
    return `<div style="display:flex;gap:6px;align-items:flex-start;padding:5px 4px;border-top:1px dashed var(--bd);${k?'background:var(--ac2);border-radius:6px':''}"><div style="flex:1;min-width:0"><b>${esc(a.n)}</b>${a.ph?` <span class="badge">${a.ph} PH</span>`:''}${k>1?` <span class="badge">×${k}</span>`:''}<details><summary class="st" style="cursor:pointer">descrição</summary><div class="st">${esc(a.d)}</div></details>${why&&(!k||a.r||a.m)&&why!='Já comprada'?`<div class="st" style="color:var(--ac)">${why}</div>`:''}</div><span style="display:flex;gap:4px">${k?`<button class="s" ${!S.lnf&&!lnFeasible(l,{...o,[a.id]:k-1})?'disabled':''} data-lb="${l.id}:${a.id}:-1" title="${!S.lnf&&!lnFeasible(l,{...o,[a.id]:k-1})?'Outras habilidades dependem desta para o mínimo de PL na linha':'Remover'}">−</button>`:''}<button ${why?'disabled':''} data-lb="${l.id}:${a.id}:1">${k?'+':'Comprar'}</button></span></div>`}).join('');
  }).join('');
  const lock=l.p?`<div class="row">${on?'':'<span class="st">🔒 Bloqueada</span>'}${l.u&&S.ln?.[l.u[0]]?.[l.u[1]]>0?'<span class="st">liberada pela linha do Guerreiro</span>':`<button class="s" data-lu="${l.id}">${S.lnu?.[l.id]?'Bloquear':'Liberar (mestre)'}</button>`}</div>`:'';
  return `<details data-ln="${l.id}" ${lnUI.open[l.id]?'open':''} style="border:1px solid var(--bd);border-radius:10px;margin:6px 0;padding:6px 8px"><summary style="cursor:pointer;font-weight:600">${esc(l.n)} <span class="badge">${sp} PL</span>${l.p?' <span class="st">prestígio</span>':''}</summary>${l.nt?`<div class="st">${esc(l.nt)}</div>`:''}${lock}${cats}</details>`}).join('')||'<div class="st">Nenhuma habilidade comprada ainda.</div>';
}
function lnSum(){const e=$('#lnsum');if(!e||!S)return;const r=lnPL()-lnTotal();e.textContent=lnTotal()+' gastos de '+lnPL()+' · restam '+r;e.style.color=r<0?'#c0392b':''}
function renderLn(){const e=$('#lnbox');if(e)e.innerHTML=lnBody();lnSum()}
function lnCard(){return `<div class="card"><h2>Linhas de evolução (PL)</h2><div class="st" style="margin-bottom:6px">Pontos de Linha: <b id="lnsum"></b> (6 no nível 1, +1 por nível) · PL extras: <input type="number" data-num data-p="plx" value="${S.plx||0}" style="width:60px;display:inline"></div><div class="st" style="margin-bottom:6px"><label style="display:inline"><input type="checkbox" data-chk data-p="lnf" ${S.lnf?'checked':''} style="width:auto"> ignorar pré-requisitos e limite de PL (mestre)</label> · <label style="display:inline"><input type="checkbox" id="lnonly" ${lnUI.only?'checked':''} style="width:auto"> só as compradas</label></div><div id="lnbox">${lnBody()}</div></div>`}
document.addEventListener('toggle',e=>{const t=e.target;if(t.dataset&&t.dataset.ln)lnUI.open[t.dataset.ln]=t.open;if(t.dataset&&t.dataset.eqid)eqUI.open[t.dataset.eqid]=t.open},true);

a é ideal para combates ágeis e permite ataques precisos.","x":"Dano: 2d6 + (FC + AG/2 ou FC) cortante + 1d6 de dano de fogo\nTipo: Uma mão, leve.\nEnergia gasta: 10 PMS ou 600PMM sempre ativo","cu":"200c"},{"n":"Adaga Envenenada de Cuziam","s":"Itens mágicos de combate","c":"AAF","kg":0.5,"d":"Leve e discreta, a adaga é excelente para ataques rápidos e furtivos.","x":"Dano: 1d6 + (AG ou FC + AG/3) cortante.\nTipo: Uma mão, leve.\nHabilidade: Quando atingido por um só ataque parece inofensivo, porém se acumula uma dose de veneno no alvo que dura 1 minutos, quando o número de doses chega a 3 dano aumenta em 1d6, aumentando mais 1d6 em, 6, 9, e 11 doses, quando o número de doses for igual ou superior a 5 doses o alvo terá que fazer um teste de RS dificuldade 7 no início de seu turno caso falhe perdera uma ação, a dificuldade aumenta em 1 a cada dose do alvo acima de 5.\nQuantidade de Núcleos: até 2 núcleos.\nEnergia gasta: 7 PMS ou 400PMM","cu":"110c"},{"n":"Martelo Grande de Jafe","s":"Itens mágicos de combate","c":"AAF","kg":12.0,"d":"Um martelo muito pesado que causa dano devastador, especialmente eficaz contra armaduras.","x":"Dano: 3d6 + (FC) contusão.\nTipo: Duas mãos, pesado, preparar.\nHabilidade 1: Quando ativado: reduz o peso para 4 kg caso segurado nas duas mãos por um usuário com 2 ou mais de FC não precisa preparar.\nHabilidade 2: Quando ativo, ignora até 3 de Mitigação do oponente quando acertar\nEnergia gasta habilidade 1: 2 PMS ou 50PMM sempre ativo\nEnergia gasta habilidade 2: 10 PMS por ataque","cu":"500c"},{"n":"Canhão de Forbin","s":"Itens mágicos de combate","c":"AAM","kg":2.0,"d":"Versátil e rápida, essa espada é ideal para combates ágeis e permite ataques precisos.","x":"Dano: 5d6 + AG contusão\nTipo: Uma mão, leve.\nAlcance: 20m/40m curto/máximo.\nMunição: Uma bola de canhão (10c) por tiro\nNúcleo mínimo: 50 PMS por tiro.","cu":"350c"},{"n":"Bolsa de carga (Pequena)","s":"Itens mágicos de combate","c":"","kg":0,"d":"uma bolsa de cerca de 30cm x dade trazendo notícias importantes, certo dia ouviu de relance que sua cidade natal iria ser atacada e que o exército já tinha saído a dias, a cidade ficava a 10.000km(sem parar pra comer ou dormir um maratonista profissional demoraria 20 dias) ele correu como louco, seu corpo deu como nunca, seu ar quase não chega aos pulmões, algumas lendas dizem que ele desmaiou várias vezes e enquanto continuava correndo e em 15 dias ele chegou ao sua cidade e conseguiu avisar o rei que com precisão milimétrica organizou seu exército para se defender no último de seu inimigo, algumas pessoas dizem que deus tomou o corpo de Melenu para ele conseguir sobreviver a essa corrida.","x":"Bônus de Mitigação: +1 (protege apenas as pernas).\nPartes Protegidas: Pernas (do joelho para baixo).\nBenefício: sua velocidade aumenta em 2 enquanto estiver correndo.","cu":"500c"},{"n":"Gancho de Escalada Arcano","s":"Itens mágicos de combate","c":"","kg":1.5,"d":"Um gancho de fabricação mais simples, utilizando ligas comuns de ferro e um núcleo mágico menor e reciclável.","x":"ipo: Equipamento Utilitário / Aventura T\nEnergia Gasta: 2 PMS por ativação\nHabilidades Especiais / Mecânica: \nDisparo Mecânico (Gasto de 2 PMS): Ao mirar em uma borda a até 10 metros e gastar 2 PMS, o gancho se fixa automaticamente, concedendo bônus de +1 em testes de arremesso/mira.\nTração Assistida: Retrai o cabo para auxiliar na subida, permitindo ignorar penalidades de terreno difícil vertical e fornecendo +1 em testes de Agilidade (AG) para escalar. A tabela a seguir estabelece as exigências da profissão Armeiro (Ofício) no Sistema Alfa. Para fabricar qualquer item, o artesão deve realizar um teste de Armeiro (2d6 + Bônus de Proficiência + Atributo Relevante) contra a Dificuldade do material. Metal (Armeiro) Mínima Armadura) Necessárias Forjado (Fácil) de Carvão (Média) Temperatura (Fácil) Moldes de Bronze Leves (Fácil+) Laminagem e Precisão (Difícil) (+3) dias Dobramento e Têmpera Dupla Purificada (Média+) Intermediário Alquímica / Crisol de Prata (Difícil) (+3) dias Fundente Anti-Oxidante (Reforço) (Média) Fusão Densificado Meteórico (Muito Difícil) dias Estelar e Chama Rúnica Estelar) com Material / Dificuldade Proficiência Tempo (Arma / Instalações Mult. Custo","cu":"60c"}];

function queueSave(){
 dirty=true;ver++;status('Salvando…');clearTimeout(timer);
 timer=setTimeout(async()=>{
  if(local||!db){dirty=false;status('');return}
  const my=ver;try{S.atualizado=Date.now();await db.collection('sheets').doc(curId).set(clean(S));if(my===ver){dirty=false;status('Salvo ✓')}}
  catch(e){status('Erro ao salvar ('+(e.code||'?')+')')}
 },700);
}

 else if(t.dataset.lb){const[l,a,dl]=t.dataset.lb.split(':'),L=LN.find(x=>x.id==l),A=L.a.find(x=>x.id==a);if(+dl>0&&lnWhy(L,A))return;if(+dl<0&&!S.lnf&&!lnFeasible(L,{...(S.ln?.[l]||{}),[a]:(+S.ln?.[l]?.[a]||0)+(+dl)}))return;const o=(S.ln??={})[l]??={},c=(+o[a]||0)+(+dl);if(c>0)o[a]=c;else delete o[a];renderLn();upd();queueSave()}
 else if(t.dataset.eqadd){const qn=Math.max(1,Math.floor(+$('#eqqty').value||1));let e;if(t.dataset.eqadd=='x')e={n:'',kg:0,q:qn,d:'',x:''};else{const v=$('#eqpick').value;if(v==='')return;const c=EQC[+v],ex=(S.eq||[]).find(x=>x.n==c.n&&x.s==c.s);if(ex){ex.q=eqQ(ex)+qn;renderEq();queueSave();return}e={n:c.n,s:c.s,c:c.c,kg:c.kg,q:qn,d:c.d,x:c.x,cu:c.cu}}e.id=Math.random().toString(36).slice(2,8);if(t.dataset.eqadd=='x')eqUI.open[e.id]=true;(S.eq??=[]).push(e);renderEq();queueSave()}
 else if(t.dataset.moe){const T=moeTot();S.coins=Math.floor(T/100);S.mc=T%100;const a=document.querySelector('[data-p="coins"]'),b=document.querySelector('[data-p="mc"]');if(a)a.value=S.coins;if(b)b.value=S.mc;moeSum();queueSave()}

 remote=null;let v=t.type=='checkbox'?t.checked:t.value;if('num' in t.dataset)v=v===''?('def' in t.dataset?null:0):+v;
 if(t.dataset.p.startsWith('esp.')){const n=t.dataset.p.slice(4),old=+S.esp?.[n]||0,nw=+v||0,pe=Math.max(0,+S.pe?.[n]||0),av=peAvail(n,pe),arr=[],dd=[];
  for(let i=0;i<nw;i++){if(i<old){arr[i]=S.espq?.[n]?.[i]??incSP(i);dd[i]=+S.espd?.[n]?.[i]||0}
   else{const b=incSP(i),pg=i==old?Math.max(1,b-av):b;arr[i]=pg;dd[i]=b-pg}}
  (S.espq??={})[n]=arr;(S.espd??={})[n]=dd}
 {const m=t.dataset.p.match(/^equip\.(\d+)\.lv$/);if(m){const q=S.equip[+m[1]],c=CAT[q.cat]||CAT['Fáceis (AAF)'],old=+q.lv||0,nw=+v||0,av=eqPeAvail(q),dd=[];

 setPath(t.dataset.p,v);
